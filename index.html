<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa — Gestão e Comunicação de Pequenos Negócios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .option-card { transition: all 0.15s ease; }
    .option-card:hover { border-color: #3b82f6; background-color: #eff6ff; }
    .option-card.selected { border-color: #2563eb; background-color: #eff6ff; box-shadow: 0 0 0 2px #bfdbfe; }
    .option-card.selected .check-indicator { opacity: 1; transform: scale(1); }
    .check-indicator { opacity: 0; transform: scale(0.5); transition: all 0.2s ease; }
    input[type="text"], textarea { transition: border-color 0.2s, box-shadow 0.2s; }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div id="root" class="max-w-2xl mx-auto px-4 py-8"></div>

      // Barra de progresso

          <div class="flex justify-between text-xs text-slate-500 mb-2">

          <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600 rounded-full transition-all duration-500 ease-out" style="width: ${percent}%"></div>
          </div>
        </div>
      `,

      // Card de opção (radio ou checkbox)
      OptionCard: ({ id, name, value, label, type, checked, onChange, isOther, otherValue }) => {
        const inputType = type === 'multiple' ? 'checkbox' : 'radio';
        const isSelected = checked ? 'selected' : '';
        const otherInput = isOther ? `
          <input 
            type="text" 
            id="other-${id}" 
            value="${otherValue || ''}" 
            placeholder="Especifique..."
            class="mt-2 w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white"
            oninput="App.handleOtherInput('${name}', this.value)"
            onclick="event.stopPropagation()"
          />
        ` : '';
        return `
          <div 
            class="option-card ${isSelected} border border-slate-200 rounded-xl p-4 cursor-pointer bg-white mb-3"
            onclick="App.toggleOption('${name}', '${value}', '${type}')"
          >
            <div class="flex items-start gap-3">
              <div class="mt-0.5 w-5 h-5 rounded-full border-2 ${type === 'multiple' ? (checked ? 'border-blue-600 bg-blue-600' : 'border-slate-300') : (checked ? 'border-blue-600 bg-blue-600' : 'border-slate-300')} flex items-center justify-center flex-shrink-0">
                ${type === 'multiple' 
                  ? (checked ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : '')
                  : (checked ? '<div class="w-2 h-2 bg-white rounded-full"></div>' : '')
                }
              </div>
              <div class="flex-1">
                <span class="text-sm font-medium text-slate-700">${label}</span>
                ${otherInput}
              </div>
            </div>
          </div>
        `;
      },

      // Campo de texto
      TextField: ({ id, value, placeholder, onInput, required }) => `

          type="text" 
          id="${id}" 
          value="${value || ''}" 
          placeholder="${placeholder || ''}"
          class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-white text-sm"
          oninput="${onInput}"
          ${required ? 'required' : ''}
        />
      `,

      // Textarea
      TextArea: ({ id, value, placeholder, onInput, rows = 4 }) => `

          id="${id}" 
          rows="${rows}"
          placeholder="${placeholder || ''}"

    // ============================================================
    // APLICAÇÃO PRINCIPAL
    // ============================================================

    const App = {
      state: {
        currentIndex: 0,
        answers: {},
        otherValues: {},
        showError: false,
        finished: false,
        startTime: Date.now(),
        responseId: ''
      },

      init() {
        this.loadFromStorage();
        if (!this.state.responseId) {
          this.state.responseId = this.generateId();
        }
        this.render();
      },

      generateId() {
        const now = new Date();
        const date = now.toISOString().slice(0,10).replace(/-/g,'');
        const random = Math.floor(Math.random() * 900 + 100);
        return `RESP-${date}-${random}`;
      },

      loadFromStorage() {
        try {
          const saved = localStorage.getItem('survey_current');
          if (saved) {
            const parsed = JSON.parse(saved);
            this.state = { ...this.state, ...parsed };
          }
        } catch (e) { console.error('Erro ao carregar:', e); }
      },

      saveToStorage() {
        try {
          localStorage.setItem('survey_current', JSON.stringify({
            currentIndex: this.state.currentIndex,
            answers: this.state.answers,
            otherValues: this.state.otherValues,
            startTime: this.state.startTime,
            responseId: this.state.responseId
          }));
        } catch (e) { console.error('Erro ao salvar:', e); }
      },

      toggleOption(questionId, value, type) {
        this.state.showError = false;
        const current = this.state.answers[questionId] || [];

        if (type === 'multiple') {
          if (current.includes(value)) {
            this.state.answers[questionId] = current.filter(v => v !== value);
          } else {
            this.state.answers[questionId] = [...current, value];
          }
        } else {
          this.state.answers[questionId] = [value];
        }

        this.saveToStorage();
        this.render();
      },

      handleOtherInput(questionId, value) {
        this.state.otherValues[questionId] = value;
        this.saveToStorage();
      },

      handleTextInput(questionId, value) {
        this.state.showError = false;
        this.state.answers[questionId] = [value];
        this.saveToStorage();
      },

      validateCurrent() {
        const q = SURVEY_DATA[this.state.currentIndex];
        if (!q.required) return true;

        const answer = this.state.answers[q.id];
        if (!answer || answer.length === 0) return false;

        // Se a resposta for "outro", precisa ter texto no other
        if (answer.includes('outro') && q.type === 'multiple') {
          const otherText = this.state.otherValues[q.id];
          if (!otherText || otherText.trim() === '') return false;
        }

        return true;
      },

      next() {
        if (!this.validateCurrent()) {
          this.state.showError = true;
          this.render();
          return;
        }

        if (this.state.currentIndex < SURVEY_DATA.length - 1) {
          this.state.currentIndex++;
          this.state.showError = false;
          this.saveToStorage();
          this.render();
        } else {
          this.finish();
        }
      },

      prev() {
        if (this.state.currentIndex > 0) {
          this.state.currentIndex--;
          this.state.showError = false;
          this.saveToStorage();
          this.render();
        }
      },

      finish() {
        if (!this.validateCurrent()) {
          this.state.showError = true;
          this.render();
          return;
        }

        // Salvar no histórico
        const allResponses = JSON.parse(localStorage.getItem('survey_history') || '[]');
        allResponses.push({
          id: this.state.responseId,
          timestamp: new Date().toISOString(),
          answers: { ...this.state.answers },
          otherValues: { ...this.state.otherValues }
        });
        localStorage.setItem('survey_history', JSON.stringify(allResponses));

        this.state.finished = true;
        localStorage.removeItem('survey_current');
        this.render();
      },

      newInterview() {
        this.state = {
          currentIndex: 0,
          answers: {},
          otherValues: {},
          showError: false,
          finished: false,
          startTime: Date.now(),
          responseId: this.generateId()
        };
        this.saveToStorage();
        this.render();
      },

      getLabelForValue(questionId, value) {
        const q = SURVEY_DATA.find(q => q.id === questionId);
        if (!q) return value;
        const opt = q.options.find(o => o.value === value);
        if (!opt) return value;
        if (opt.isOther && this.state.otherValues[questionId]) {
          return `Outro: ${this.state.otherValues[questionId]}`;
        }
        return opt.label;
      },

      buildWhatsAppMessage() {
        const now = new Date();
        const dateStr = now.toLocaleString('pt-BR');
        const duration = Math.round((Date.now() - this.state.startTime) / 60000);

        let text = `📋 *Resposta de Pesquisa*\n`;
        text += `ID: ${this.state.responseId}\n`;
        text += `Data: ${dateStr}\n`;
        text += `Duração: ${duration} min\n`;
        text += `─────────────────────\n\n`;

        let currentSection = '';
        SURVEY_DATA.forEach(q => {
          const answer = this.state.answers[q.id];
          if (!answer || answer.length === 0) return;

          if (q.section !== currentSection) {
            currentSection = q.section;
            text += `*${currentSection}*\n`;
          }

          const labels = answer.map(v => this.getLabelForValue(q.id, v));
          text += `• ${q.question}\n`;
          text += `  → ${labels.join(' | ')}\n\n`;
        });

        text += `─────────────────────\n`;
        text += `Esta pesquisa faz parte de um estudo independente sobre gestão de pequenos negócios. Dados para análise agregada apenas.`;

        return text;
      },

      getWhatsAppLink() {
        const message = this.buildWhatsAppMessage();
        const encoded = encodeURIComponent(message);
        return `https://wa.me/5517996484654?text=${encoded}`;
      },

      render() {
        const root = document.getElementById('root');

        if (this.state.finished) {
          root.innerHTML = UI.ThankYou({
            onNewInterview: 'App.newInterview()',
            onSendWhatsApp: this.getWhatsAppLink()
          });
          return;
        }

        const q = SURVEY_DATA[this.state.currentIndex];
        const total = SURVEY_DATA.length;
        const percent = ((this.state.currentIndex + 1) / total) * 100;
        const isLast = this.state.currentIndex === total - 1;

        let questionHTML = '';

        if (q.type === 'single' || q.type === 'multiple') {
          const currentAnswers = this.state.answers[q.id] || [];
          questionHTML = q.options.map(opt => {
            const checked = currentAnswers.includes(opt.value);
            const otherVal = opt.isOther ? this.state.otherValues[q.id] : '';
            return UI.OptionCard({
              id: `${q.id}-${opt.value}`,
              name: q.id,
              value: opt.value,
              label: opt.label,
              type: q.type,
              checked,
              isOther: opt.isOther,
              otherValue: otherVal
            });
          }).join('');
        } else if (q.type === 'text') {
          const value = (this.state.answers[q.id] || [])[0] || '';
          questionHTML = UI.TextArea({
            id: q.id,
            value,
            placeholder: q.placeholder,
            onInput: `App.handleTextInput('${q.id}', this.value)`
          });
        }

        const sectionTitle = this.state.currentIndex === 0 || 
          SURVEY_DATA[this.state.currentIndex - 1].section !== q.section
          ? UI.SectionTitle(q.section)
          : '';

        root.innerHTML = UI.Container(`
          ${UI.Header({
            title: 'Pesquisa de Campo',
            subtitle: 'Gestão e Comunicação de Pequenos Negócios no Brasil'
          })}

          ${UI.ProgressBar({
            current: this.state.currentIndex + 1,
            total,
            percent
          })}

          ${sectionTitle}

          <div class="mb-6">
            <h3 class="text-base font-medium text-slate-800 mb-1">${q.question}</h3>
            ${q.type === 'multiple' ? '<p class="text-xs text-slate-400 mb-4">Você pode marcar mais de uma opção</p>' : ''}
            ${q.required ? '<p class="text-xs text-slate-400 mb-4">* Obrigatório</p>' : '<p class="text-xs text-slate-400 mb-4">Opcional</p>'}
          </div>

          ${this.state.showError ? UI.ErrorAlert('Por favor, selecione uma resposta para continuar.') : ''}

          <div class="space-y-1">
            ${questionHTML}
          </div>

          ${UI.NavButtons({
            showPrev: this.state.currentIndex > 0,
            showNext: true,
            nextLabel: isLast ? 'Finalizar e enviar' : 'Próxima',
            onPrev: 'App.prev()',
            onNext: 'App.next()',
            nextDisabled: false
          })}

          <p class="text-center text-xs text-slate-400 mt-6">
            Pesquisa independente • Dados para análise agregada
          </p>
        `);
      }
    };

    // Iniciar
    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
